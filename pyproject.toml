[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "legion-guard"
version = "0.2.1"
description = "Verify before connect: check the MCP tools your client receives against your approvals and LEGION's signed log"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["mcp>=1.0"]
optional-dependencies = {crypto = ["cryptography"]}

[project.urls]
Homepage = "https://legion-api.com/verify-before-connect/"
Source = "https://github.com/Legion33shadow/legion-mcp"

[tool.setuptools]
packages = ["legion_guard", "legion_guard.vendor"]
